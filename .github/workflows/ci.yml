name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Check version consistency
        run: |
          ROOT_VERSION=$(jq -r '.version' package.json)
          METADATA=$(cargo metadata --locked --no-deps --format-version 1)
          SERVER_VERSION=$(jq -r '.packages[] | select(.name == "server") | .version' <<<"$METADATA")
          CLI_VERSION=$(jq -r '.packages[] | select(.name == "order-wizard-cli") | .version' <<<"$METADATA")

          echo "Root: $ROOT_VERSION, Server: $SERVER_VERSION, CLI: $CLI_VERSION"

          if [ "$ROOT_VERSION" != "$SERVER_VERSION" ] || [ "$ROOT_VERSION" != "$CLI_VERSION" ]; then
            echo "::error::Version mismatch! Root=$ROOT_VERSION, Server=$SERVER_VERSION, CLI=$CLI_VERSION. Run 'just bump <version>' to sync."
            exit 1
          fi

      - name: Install extension dependencies
        working-directory: apps/extension
        run: bun install --frozen-lockfile

      - name: Extension typecheck
        working-directory: apps/extension
        run: bun run typecheck

      - name: Extension lint
        working-directory: apps/extension
        run: bun run lint

      - name: Extension tests
        working-directory: apps/extension
        run: bun run test

      - name: Extension build
        working-directory: apps/extension
        run: bun run build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked
